<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本語 · Aprende Japonés</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌸</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<style>
  :root{
    --bg:#faf6ef; --card:#ffffff; --ink:#3a3226; --sub:#8a8070;
    --red:#c93b3b; --red-dark:#a52f2f; --gold:#e0a52e; --green:#4e9a51;
    --line:#e8e0d0; --locked:#d8d0c0; --shadow:0 2px 8px rgba(90,70,40,.10);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    font-size:17px; line-height:1.45;
  }
  .jp{font-family:"Yu Gothic","Yu Mincho","Meiryo","MS Gothic",sans-serif;}
  #app{max-width:560px; margin:0 auto; padding:14px 14px 60px;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 2px 12px; gap:8px;
  }
  header h1{font-size:20px; margin:0; letter-spacing:.5px;}
  .stats{display:flex; gap:10px; align-items:center; font-weight:600;}
  .pill{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:4px 12px; box-shadow:var(--shadow); font-size:15px; white-space:nowrap;
  }
  .pill.hot{border-color:var(--gold); background:#fff8e8;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin:12px 0; box-shadow:var(--shadow);
  }
  .btn{
    display:inline-block; border:none; border-radius:14px; cursor:pointer;
    background:var(--red); color:#fff; font-size:17px; font-weight:700;
    padding:12px 22px; box-shadow:0 3px 0 var(--red-dark);
    transition:transform .05s;
  }
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--red-dark);}
  .btn.sec{background:#fff; color:var(--ink); border:2px solid var(--line); box-shadow:0 3px 0 var(--line);}
  .btn.green{background:var(--green); box-shadow:0 3px 0 #3c7a3f;}
  .btn.big{width:100%; padding:15px; font-size:18px;}
  .btn:disabled{background:var(--locked); box-shadow:0 3px 0 #c4bcac; cursor:default; color:#fff;}
  .muted{color:var(--sub); font-size:14px;}
  .center{text-align:center;}
  .goalbar{height:12px; background:#efe8da; border-radius:8px; overflow:hidden; margin-top:8px;}
  .goalbar>div{height:100%; background:linear-gradient(90deg,var(--gold),#f0c060); border-radius:8px; transition:width .3s;}
  .section-title{
    margin:22px 4px 6px; font-size:15px; font-weight:700; color:var(--sub);
    text-transform:uppercase; letter-spacing:1px;
  }
  .lesson-row{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    margin:8px 0; cursor:pointer; box-shadow:var(--shadow);
  }
  .lesson-row.locked{opacity:.55; cursor:default;}
  .lesson-row .badge{
    width:44px; height:44px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:#fff; background:var(--red);
  }
  .lesson-row.done .badge{background:var(--green);}
  .lesson-row.locked .badge{background:var(--locked);}
  .lesson-row .t{font-weight:700;}
  .lesson-row .s{font-size:13px; color:var(--sub);}
  .kana-hero{font-size:96px; line-height:1.1; text-align:center; margin:4px 0;}
  .romaji-hero{text-align:center; font-size:26px; font-weight:700; color:var(--red); margin-bottom:4px;}
  .mnemonic{
    background:#fff8e8; border:1px dashed var(--gold); border-radius:12px;
    padding:10px 14px; font-size:15px; margin:10px 0;
  }
  canvas.trace{
    display:block; margin:10px auto; background:#fff; border:2px dashed var(--line);
    border-radius:14px; touch-action:none; cursor:crosshair;
    width:260px; height:260px; max-width:100%; aspect-ratio:1/1;
  }
  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .opt{
    background:#fff; border:2px solid var(--line); border-radius:14px;
    padding:14px 8px; font-size:22px; font-weight:700; text-align:center;
    cursor:pointer; box-shadow:0 3px 0 var(--line); transition:transform .05s;
  }
  .opt:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
  .opt.good{border-color:var(--green); background:#eef7ee; box-shadow:0 3px 0 var(--green);}
  .opt.bad{border-color:var(--red); background:#fdecec; box-shadow:0 3px 0 var(--red);}
  .opt.small{font-size:16px; font-weight:600;}
  .qbar{height:10px; background:#efe8da; border-radius:8px; overflow:hidden; margin-bottom:14px;}
  .qbar>div{height:100%; background:var(--green); transition:width .3s;}
  .feedback{margin-top:12px; font-weight:700; font-size:17px; min-height:26px;}
  .feedback.ok{color:var(--green);}
  .feedback.no{color:var(--red);}
  .topnav{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .backbtn{
    background:none; border:none; font-size:26px; cursor:pointer; color:var(--sub);
    padding:2px 8px; border-radius:8px;
  }
  .backbtn:hover{background:#f0e9db;}
  table.chart{border-collapse:collapse; width:100%;}
  table.chart td{
    border:1px solid var(--line); text-align:center; padding:7px 2px;
    font-size:20px; background:#fff; border-radius:4px;
  }
  table.chart td small{display:block; color:var(--sub); font-size:11px;}
  .tabs{display:flex; gap:8px; margin:10px 0;}
  .tab{
    flex:1; text-align:center; padding:9px; border-radius:12px; font-weight:700;
    background:#fff; border:2px solid var(--line); cursor:pointer;
  }
  .tab.on{background:var(--red); color:#fff; border-color:var(--red);}
  .bigmsg{font-size:42px; text-align:center; margin:10px 0;}
  .note{background:#eef3f9; border:1px dashed #7d9cc0; border-radius:12px; padding:10px 14px; font-size:15px; margin:10px 0;}
  textarea.io{width:100%; height:70px; border:1px solid var(--line); border-radius:10px; padding:8px; font-size:12px;}
  a{color:var(--red);}
</style>
</head>

/* Número de trazos estándar (筆順). Los kana con dakuten no se listan:
   se descomponen con NFD y se suman ゛=2 trazos, ゜=1 trazo. */
const STROKES = {
  "あ":3,"い":2,"う":2,"え":2,"お":3,
  "か":3,"き":4,"く":1,"け":3,"こ":2,
  "さ":3,"し":1,"す":2,"せ":3,"そ":1,
  "た":4,"ち":2,"つ":1,"て":1,"と":2,
  "な":4,"に":3,"ぬ":2,"ね":2,"の":1,
  "は":3,"ひ":1,"ふ":4,"へ":1,"ほ":4,
  "ま":3,"み":2,"む":3,"め":2,"も":3,
  "や":3,"ゆ":2,"よ":2,
  "ら":2,"り":2,"る":1,"れ":2,"ろ":1,
  "わ":2,"を":3,"ん":1,
  "ゃ":3,"ゅ":2,"ょ":2,
  "ア":2,"イ":2,"ウ":3,"エ":3,"オ":3,
  "カ":2,"キ":3,"ク":2,"ケ":3,"コ":2,
  "サ":3,"シ":3,"ス":2,"セ":2,"ソ":2,
  "タ":3,"チ":3,"ツ":3,"テ":3,"ト":2,
  "ナ":2,"ニ":2,"ヌ":2,"ネ":4,"ノ":1,
  "ハ":2,"ヒ":2,"フ":1,"ヘ":1,"ホ":4,
  "マ":2,"ミ":3,"ム":2,"メ":2,"モ":3,
  "ヤ":2,"ユ":2,"ヨ":3,
  "ラ":2,"リ":2,"ル":2,"レ":1,"ロ":3,
  "ワ":2,"ヲ":3,"ン":2
};

// Cuenta los trazos de un kana, incluidos compuestos (きゃ) y dakuten (が).
function strokeCount(s){
  let total = 0;
  for(const ch of s.normalize("NFD")){
    if(ch === "゙"){ total += 2; continue; }  // ゛ dakuten
    if(ch === "゚"){ total += 1; continue; }  // ゜ handakuten
    if(STROKES[ch] === undefined) return null;    // desconocido: no evaluamos
    total += STROKES[ch];
  }
  return total;
}

function save(){ try{ localStorage.setItem("nihongoState", JSON.stringify(state)); }catch(e){} }

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function diffDays(a,b){
  if(!a||!b) return 999;
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function xpToday(){
  return state.xpDay === todayStr() ? state.xpToday : 0;
}
function currentStreak(){
  if(!state.lastStreakDay) return 0;
  const d = diffDays(state.lastStreakDay, todayStr());
  return (d===0 || d===1) ? state.streak : 0;
}
function addXp(n){
  const t = todayStr();
  if(state.xpDay !== t){ state.xpDay = t; state.xpToday = 0; }
  const before = state.xpToday;
  state.xpToday += n;
  state.totalXp += n;
  if(before < XP_GOAL && state.xpToday >= XP_GOAL && state.lastStreakDay !== t){
    state.streak = (diffDays(state.lastStreakDay, t) === 1) ? state.streak + 1 : 1;
    state.lastStreakDay = t;
  }
  save();
}
function addSrsItems(lesson){
  const now = Date.now();
  const items = lesson.kana ? lesson.kana.map(k=>({id:k[0],t:"k"})) :
                              lesson.words.map(w=>({id:w[0],t:"w"}));
  items.forEach(it=>{
    if(!state.srs[it.id]) state.srs[it.id] = {t:it.t, box:0, due:now};
  });
  save();
}
function dueItems(){
  const now = Date.now();
  return Object.keys(state.srs).filter(id => state.srs[id].due <= now);
}

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pick(arr,n,exclude){
  const pool = shuffle(arr.filter(x=>x!==exclude));
  return pool.slice(0,n);
}

/* --- Canvas de trazado y evaluación --- */

const CANVAS_PX  = 260;   // resolución del canvas visible
const BRUSH      = 8;     // grosor del trazo del usuario
const AN         = 110;   // resolución a la que se analiza (más chico = más rápido)
const TOL        = 3;     // tolerancia en píxeles de análisis (~7px reales)
                          // Calibrado con trazos simulados: con 3, trazar la línea
                          // central da 76-100% de cobertura incluso con pulso tembloroso,
                          // pero un garabato al azar se queda por debajo del 60%.
const TOL_MEM    = 4;     // tolerancia al dibujar de memoria (algo más generosa)
const SEARCH     = 10;    // busca el mejor encaje desplazando ±10 px de análisis
const MIN_NET    = 0.60;  // calificación neta mínima con guía
const MIN_NET_MEM= 0.55;  // calificación neta mínima de memoria

/* Calificación neta = cobertura − OUT_W·(tinta fuera) − EXC_W·(tinta de más)
   Ambos castigos se miden EN PROPORCIÓN AL TAMAÑO DE LA LETRA, no a tu tinta:
   así, entre más rayes, más caro sale. Calibrado sobre los 126 kana con trazos
   simulados (trazo limpio, temblor suave, manchón, rayones):
     · tinta de un trazo real ....... 0.62 – 0.90 veces la letra
     · tinta de un manchón .......... 1.89 – 2.30 veces la letra
   Con estos valores: 126/126 trazos legítimos aprueban (peor caso 81%) y
   0/126 manchones o rayoneos aprueban. */
const OUT_W      = 2.0;   // peso de la tinta que cae fuera de la letra
const ALLOW_INK  = 1.25;  // tinta «gratis»: hasta 1.25 veces el tamaño de la letra
const EXC_W      = 1.2;   // peso de la tinta que exceda ese margen

let traceCtx = null, traceChar = "", drawing = false;
let strokes = [];         // [[{x,y},...], ...] un arreglo por trazo
let guideField = null;    // distancia de cada píxel a la letra guía
let guideVisible = true;  // false en práctica «de memoria»
let pracScored = false;   // evita cobrar XP dos veces por el mismo dibujo

function drawGuide(){
  const c = document.getElementById("trace");
  if(!c) return;
  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle = "#efe8da";
  ctx.font = glyphFont();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(traceChar, c.width/2, c.height/2 + 8);
}
function glyphFont(){
  const size = traceChar.length > 1 ? 130 : 200;
  return size+'px "Yu Gothic","Meiryo",sans-serif';
}
function redrawInk(){
  const c = document.getElementById("trace");
  if(!c) return;
  const ctx = c.getContext("2d");
  ctx.strokeStyle = "#c93b3b";
  ctx.lineWidth = BRUSH;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  strokes.forEach(st=>{
    if(st.length < 2) {
      // un toque suelto: dibuja un punto para que se vea
      ctx.beginPath(); ctx.arc(st[0].x, st[0].y, BRUSH/2, 0, 6.284);
      ctx.fillStyle = "#c93b3b"; ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(st[0].x, st[0].y);
    for(let i=1;i<st.length;i++) ctx.lineTo(st[i].x, st[i].y);
    ctx.stroke();
  });
}

/* Máscara binaria (a resolución AN) de lo que se dibuje en un canvas oculto */
function maskFrom(drawFn){
  const off = document.createElement("canvas");
  off.width = AN; off.height = AN;
  const g = off.getContext("2d");
  g.scale(AN/CANVAS_PX, AN/CANVAS_PX);
  drawFn(g);
  const px = g.getImageData(0,0,AN,AN).data;
  const m = new Uint8Array(AN*AN);
  for(let i=0;i<AN*AN;i++) m[i] = px[i*4+3] > 40 ? 1 : 0;   // alfa > 40 = hay tinta
  return m;
}

/* Transformada de distancia (chamfer, dos pasadas):
   devuelve para cada píxel la distancia al píxel encendido más cercano. */
function distanceField(mask){
  const INF = 1e9, d = new Float32Array(AN*AN);
  for(let i=0;i<AN*AN;i++) d[i] = mask[i] ? 0 : INF;
  for(let y=0;y<AN;y++) for(let x=0;x<AN;x++){
    const i=y*AN+x; let v=d[i];
    if(x>0)            v=Math.min(v, d[i-1]+1);
    if(y>0)            v=Math.min(v, d[i-AN]+1);
    if(x>0   && y>0)   v=Math.min(v, d[i-AN-1]+1.414);
    if(x<AN-1&& y>0)   v=Math.min(v, d[i-AN+1]+1.414);
    d[i]=v;
  }
  for(let y=AN-1;y>=0;y--) for(let x=AN-1;x>=0;x--){
    const i=y*AN+x; let v=d[i];
    if(x<AN-1)           v=Math.min(v, d[i+1]+1);
    if(y<AN-1)           v=Math.min(v, d[i+AN]+1);
    if(x<AN-1&&y<AN-1)   v=Math.min(v, d[i+AN+1]+1.414);
    if(x>0   &&y<AN-1)   v=Math.min(v, d[i+AN-1]+1.414);
    d[i]=v;
  }
  return d;
}

function buildGuideField(){
  const gm = maskFrom(g=>{
    g.fillStyle = "#000";
    g.font = glyphFont();
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(traceChar, CANVAS_PX/2, CANVAS_PX/2 + 8);
  });
  let minx=AN, miny=AN, maxx=0, maxy=0, count=0;
  for(let y=0;y<AN;y++) for(let x=0;x<AN;x++){
    if(gm[y*AN+x]){
      count++;
      if(x<minx)minx=x; if(x>maxx)maxx=x;
      if(y<miny)miny=y; if(y>maxy)maxy=y;
    }
  }
  const f = CANVAS_PX/AN;   // caja de la letra en píxeles del canvas
  guideField = {mask:gm, field:distanceField(gm), count:count,
                bbox:{minx:minx*f, miny:miny*f, maxx:maxx*f, maxy:maxy*f}};
}

/* Compara tinta contra la guía probando pequeños desplazamientos,
   para no castigarte por empezar un poco corrido de lugar. */
function scoreStrokes(sts, tol){
  if(!sts.length || !guideField || !guideField.count) return null;
  const im = maskFrom(g=>{
    g.strokeStyle="#000"; g.fillStyle="#000";
    g.lineWidth=BRUSH; g.lineCap="round"; g.lineJoin="round";
    sts.forEach(st=>{
      if(st.length<2){ g.beginPath(); g.arc(st[0].x,st[0].y,BRUSH/2,0,6.284); g.fill(); return; }
      g.beginPath(); g.moveTo(st[0].x,st[0].y);
      for(let i=1;i<st.length;i++) g.lineTo(st[i].x,st[i].y);
      g.stroke();
    });
  });
  let inkCount = 0;
  for(let i=0;i<im.length;i++) inkCount += im[i];
  if(!inkCount) return null;

  const inkField = distanceField(im);
  const gField = guideField.field, gMask = guideField.mask;
  let best = {cover:0, inside:0, sum:-1};

  for(let dy=-SEARCH; dy<=SEARCH; dy+=2){
    for(let dx=-SEARCH; dx<=SEARCH; dx+=2){
      let covered = 0, inside = 0;
      for(let y=0;y<AN;y++){
        const sy = y - dy;
        if(sy<0 || sy>=AN) continue;
        for(let x=0;x<AN;x++){
          const i = y*AN+x;
          const sx = x - dx;
          if(sx<0 || sx>=AN) continue;
          // ¿la letra está cubierta por tinta desplazada?
          if(gMask[i] && inkField[sy*AN+sx] <= tol) covered++;
          // ¿la tinta desplazada cae sobre la letra?
          if(im[i]){
            const ty = y+dy, tx = x+dx;
            if(ty>=0 && ty<AN && tx>=0 && tx<AN && gField[ty*AN+tx] <= tol) inside++;
          }
        }
      }
      const cover = covered/guideField.count, ins = inside/inkCount;
      if(cover + ins > best.sum) best = {cover:cover, inside:ins, sum:cover+ins};
    }
  }
  // Relativos al tamaño de la letra (no a tu tinta): rayar de más sale caro.
  best.ink = inkCount/guideField.count;                 // tinta usada ÷ letra
  best.out = (1-best.inside)*inkCount/guideField.count; // tinta fuera ÷ letra
  return best;
}
// Los kana combinados (きゃ) se dibujan más chicos, así que sus trazos son más
// delgados: se les da un píxel más de tolerancia para que no salgan castigados.
function tolFor(mem){
  const base = mem ? TOL_MEM : TOL;
  return traceChar.length > 1 ? base + 1 : base;
}
function scoreTrace(){ return scoreStrokes(strokes, tolFor(false)); }
function netScore(s){
  return Math.max(0, s.cover - OUT_W*s.out - EXC_W*Math.max(0, s.ink - ALLOW_INK));
}

/* Para el modo «de memoria»: escala y centra tu dibujo a la caja de la
   letra real, para que el tamaño y la posición no importen — solo la forma. */
function inkBBox(){
  let minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9;
  strokes.forEach(st=>st.forEach(p=>{
    if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x;
    if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y;
  }));
  return {minx:minx, miny:miny, maxx:maxx, maxy:maxy};
}
function normalizeInk(){
  const gb = guideField.bbox;
  const ib = inkBBox();
  const iw = ib.maxx-ib.minx, ih = ib.maxy-ib.miny;
  const gw = gb.maxx-gb.minx, gh = gb.maxy-gb.miny;
  if(Math.max(iw,ih) < 60 || Math.min(iw,ih) < 15){
    return {err:"Dibuja el carácter más grande para poder evaluarlo."};
  }
  const aspect = (iw/ih)/(gw/gh);
  if(aspect > 2.3 || aspect < 1/2.3){
    return {err:"La proporción no coincide: tu dibujo quedó demasiado "+(aspect>1?"ancho":"alto")+" para "+traceChar+"."};
  }
  const sx = gw/iw, sy = gh/ih;
  return {strokes: strokes.map(st=>st.map(p=>({
    x: gb.minx + (p.x-ib.minx)*sx,
    y: gb.miny + (p.y-ib.miny)*sy
  })))};
}

function initTrace(ch, showGuide){
  traceChar = ch;
  strokes = [];
  guideVisible = showGuide !== false;
  pracScored = false;
  const c = document.getElementById("trace");
  if(!c) return;
  traceCtx = c.getContext("2d");
  if(guideVisible) drawGuide();
  else traceCtx.clearRect(0,0,c.width,c.height);
  buildGuideField();
  updateStrokeCounter();

  const pos = ev => {
    const r = c.getBoundingClientRect();
    return { x:(ev.clientX - r.left) * c.width / r.width,
             y:(ev.clientY - r.top)  * c.height / r.height };
  };
  c.onpointerdown = ev => {
    ev.preventDefault();
    drawing = true;
    c.setPointerCapture(ev.pointerId);
    strokes.push([pos(ev)]);
    traceCtx.beginPath();
    traceCtx.moveTo(strokes[strokes.length-1][0].x, strokes[strokes.length-1][0].y);
    updateStrokeCounter();
  };
  c.onpointermove = ev => {
    if(!drawing) return;
    ev.preventDefault();
    const p = pos(ev);
    strokes[strokes.length-1].push(p);
    traceCtx.lineTo(p.x, p.y);
    traceCtx.strokeStyle = "#c93b3b";
    traceCtx.lineWidth = BRUSH;
    traceCtx.lineCap = "round";
    traceCtx.lineJoin = "round";
    traceCtx.stroke();
  };
  c.onpointerup = c.onpointercancel = () => { drawing = false; };
}

function clearTrace(){
  strokes = [];
  pracScored = false;
  const c = document.getElementById("trace");
  if(c){
    if(guideVisible) drawGuide();
    else c.getContext("2d").clearRect(0,0,c.width,c.height);
  }
  updateStrokeCounter();
  const fb = document.getElementById("traceFb");
  if(fb){ fb.textContent = ""; fb.className = "feedback"; }
  setNextEnabled(!state.strict);
}

function updateStrokeCounter(){
  const el = document.getElementById("strokeCount");
  if(!el) return;
  const need = strokeCount(traceChar);
  const have = strokes.length;
  if(need === null){ el.textContent = "Trazos: " + have; return; }
  const ok = have === need;
  el.innerHTML = 'Trazos: <b style="color:'+(ok?"var(--green)":"var(--sub)")+'">'+have+'</b> de '+need +
                 (ok ? ' <span style="color:var(--green)">✓</span>' : '');
}

function setNextEnabled(on){
  const b = document.getElementById("nextBtn");
  if(b) b.disabled = !on;
}

function checkTrace(){
  const fb = document.getElementById("traceFb");
  if(!fb) return;
  const need = strokeCount(traceChar);
  const have = strokes.length;

  if(!strokes.length){
    fb.textContent = "Aún no has trazado nada ✍️";
    fb.className = "feedback no";
    return;
  }

  let s, minNet;
  if(guideVisible){
    s = scoreTrace();
    minNet = MIN_NET;
  } else {
    const n = normalizeInk();
    if(n.err){ fb.textContent = n.err; fb.className = "feedback no"; return; }
    s = scoreStrokes(n.strokes, tolFor(true));
    minNet = MIN_NET_MEM;
  }
  if(!s){ fb.textContent = "No pude leer el trazo, inténtalo de nuevo."; fb.className="feedback no"; return; }

  const neto   = netScore(s);
  const netoP  = Math.round(neto*100);
  const cover  = Math.round(s.cover*100);
  const fuera  = Math.round(s.out*100);          // tinta fuera, ÷ tamaño de la letra
  const exceso = Math.max(0, s.ink - ALLOW_INK);  // tinta de más
  const pierdeFuera  = OUT_W*s.out;
  const pierdeExceso = EXC_W*exceso;
  const minP = Math.round(minNet*100);
  const formaOk  = neto >= minNet;
  const trazosOk = (need === null) || (have === need);

  let msg, cls;
  if(formaOk && trazosOk){
    msg = "¡Muy bien! 🎉 Forma: "+netoP+"% (cubriste "+cover+"%, fuera "+fuera+"%)" +
          (need!==null ? " · "+need+" trazo"+(need===1?"":"s")+" ✓" : "");
    cls = "feedback ok";
  } else if(formaOk && !trazosOk){
    msg = "La forma quedó bien ("+netoP+"%), pero "+traceChar+" se escribe con "+need+
          " trazo"+(need===1?"":"s")+" y tú hiciste "+have+". Levanta el lápiz entre trazo y trazo.";
    cls = "feedback no";
  } else if(pierdeExceso >= pierdeFuera && exceso > 0){
    msg = "Rellenaste la letra en vez de trazar su línea: gastaste "+s.ink.toFixed(1)+
          " veces la tinta que tiene "+traceChar+". Neto "+netoP+"% y se necesita "+minP+
          "%. Sigue la línea de en medio con un solo pasada 😉";
    cls = "feedback no";
  } else if(pierdeFuera > 0.15){
    msg = "Cubriste el "+cover+"%, pero te saliste bastante (tinta fuera: "+fuera+
          "% del tamaño de la letra): neto "+netoP+"% y se necesita "+minP+"%. Menos rayones, más línea.";
    cls = "feedback no";
  } else {
    msg = (guideVisible ? "Te faltó letra: forma "+netoP+"% y se necesita "+minP+"%. Repasa la guía completa."
                        : "Aún no se parece lo suficiente: forma "+netoP+"% y se necesita "+minP+"%. Compara tu trazo con la guía que apareció.");
    cls = "feedback no";
  }

  if(!guideVisible){
    // Revela la guía debajo de tu dibujo para que compares
    drawGuide();
    redrawInk();
    if(formaOk && trazosOk && !pracScored){
      pracScored = true;
      addXp(XP_REVIEW);
      msg += " · +"+XP_REVIEW+" XP";
    }
  }

  fb.textContent = msg;
  fb.className = cls;

  if(state.strict && guideVisible) setNextEnabled(formaOk && trazosOk);
}

function toggleStrict(){
  state.strict = !state.strict;
  save();
  renderTeach();
}

/* ================= QUIZ DE LECCIÓN ================= */

let quiz = null; // {questions, i, correct, mode:'lesson'|'review'}

function makeKanaQuestion(kana, dir, pool){
  // dir 0: kana -> romaji ; dir 1: romaji -> kana
  let distract;
  if(dir===0){
    // lecturas únicas y distintas a la respuesta
    const cand = Array.from(new Set(pool.map(k=>k[1]))).filter(r=>r!==kana[1]);
    distract = shuffle(cand).slice(0,3);
  } else {
    // símbolos cuya lectura NO sea la misma (evita que ぢ cuente como error si piden «ji»)
    const cand = pool.filter(k=>k[1]!==kana[1]).map(k=>k[0]);
    distract = shuffle(Array.from(new Set(cand))).slice(0,3);
  }
  const answer = dir===0 ? kana[1] : kana[0];
  return {
    prompt: dir===0 ? kana[0] : kana[1],
    promptBig: dir===0,
    label: dir===0 ? "¿Cómo se lee?" : "¿Cuál es el símbolo?",
    options: shuffle(distract.concat([answer])),
    answer: answer,
    jpOptions: dir===1,
    itemId: kana[0]
  };
}
function makeWordQuestion(word, dir, pool){
  // dir 0: jp -> es ; dir 1: es -> jp
  const distract = pick(pool.map(w=>w[dir===0?2:0]), 3, word[dir===0?2:0]);
  const answer = dir===0 ? word[2] : word[0];
  return {
    prompt: dir===0 ? word[0] : word[2],
    promptBig: dir===0,
    sub: dir===0 ? "("+word[1]+")" : "",
    label: dir===0 ? "¿Qué significa?" : "¿Cómo se escribe en japonés?",
    options: shuffle(distract.concat([answer])),
    answer: answer,
    jpOptions: dir===1,
    smallOptions: dir===0,
    itemId: word[0]
  };
}

function startQuiz(){
  const L = cur.lesson;
  let qs = [];
  if(L.kana){
    const pool = L.kana.length >= 4 ? L.kana
      : KANA_ALL.filter(k => HIRA_SET.has(k[0]) === HIRA_SET.has(L.kana[0][0]));
    L.kana.forEach(k=>{
      qs.push(makeKanaQuestion(k,0,pool));
      qs.push(makeKanaQuestion(k,1,pool));
    });
  } else {
    L.words.forEach(w=>{
      qs.push(makeWordQuestion(w,0,L.words.length>=4?L.words:WORD_ALL));
      qs.push(makeWordQuestion(w,1,L.words.length>=4?L.words:WORD_ALL));
    });
  }
  quiz = {questions:shuffle(qs), i:0, correct:0, mode:"lesson"};
  renderQuestion();
}

const HIRA_SET = new Set(HIRAGANA_BASE.concat(HIRAGANA_DAKUTEN, HIRAGANA_COMBO).map(k=>k[0]));

function startReview(){
  const ids = shuffle(dueItems()).slice(0,20);
  // Distractores solo entre lo YA aprendido: si aparecen símbolos que nunca
  // has visto, la respuesta se adivina por descarte y el repaso no sirve.
  const learnedW = WORD_ALL.filter(w=> state.srs[w[0]]);
  const wordPool = learnedW.length >= 4 ? learnedW : WORD_ALL;
  let qs = ids.map(id=>{
    const it = state.srs[id];
    const dir = Math.random()<0.5 ? 0 : 1;
    if(it.t==="k"){
      const k = KANA_MAP[id];
      const same = KANA_ALL.filter(x=> HIRA_SET.has(x[0]) === HIRA_SET.has(id));
      const learned = same.filter(x=> state.srs[x[0]]);
      return makeKanaQuestion(k, dir, learned.length >= 5 ? learned : same);
    } else {
      return makeWordQuestion(WORD_MAP[id], dir, wordPool);
    }
  });
  quiz = {questions:qs, i:0, correct:0, mode:"review", again:[]};
  renderQuestion();
}

function renderQuestion(){
  const q = quiz.questions[quiz.i];
  const total = quiz.questions.length;
  let html = topnav(quiz.mode==="review" ? "Repaso" : "Quiz: "+cur.lesson.title);
  html += '<div class="qbar"><div style="width:'+Math.round(quiz.i/total*100)+'%"></div></div>';
  html += '<div class="card center">';
  html += '<div class="muted">'+esc(q.label)+'</div>';
  if(q.promptBig){
    html += '<div class="kana-hero jp" style="font-size:'+(q.prompt.length>3?'44':'80')+'px">'+esc(q.prompt)+'</div>';
  } else {
    html += '<div style="font-size:30px; font-weight:800; margin:16px 0">'+esc(q.prompt)+'</div>';
  }
  html += '<div class="options">';
  q.options.forEach((op,j)=>{
    const cls = "opt" + (q.jpOptions?" jp":"") + (q.smallOptions?" small":"");
    html += '<div class="'+cls+'" id="opt'+j+'" onclick="answer('+j+')">'+esc(op)+'</div>';
  });
  html += '</div><div class="feedback" id="fb"></div></div>';
  html += '<p class="center muted">Pregunta '+(quiz.i+1)+' de '+total+'</p>';
  app.innerHTML = html;
  window.scrollTo(0,0);
}

let answered = false;
function answer(j){
  if(answered) return;
  answered = true;
  const q = quiz.questions[quiz.i];
  const chosen = q.options[j];
  const ok = chosen === q.answer;
  const fb = document.getElementById("fb");
  if(ok){
    document.getElementById("opt"+j).classList.add("good");
    fb.textContent = "¡Correcto! 🎉";
    fb.className = "feedback ok";
    quiz.correct++;
  } else {
    document.getElementById("opt"+j).classList.add("bad");
    q.options.forEach((op,idx)=>{ if(op===q.answer) document.getElementById("opt"+idx).classList.add("good"); });
    fb.textContent = "La respuesta era: "+q.answer;
    fb.className = "feedback no";
  }
  // SRS en modo repaso
  if(quiz.mode==="review"){
    const it = state.srs[q.itemId];
    if(it){
      if(ok){
        addXp(XP_REVIEW);
        it.box = Math.min(it.box+1, SRS_DAYS.length-1);
        it.due = Date.now() + SRS_DAYS[it.box]*86400000;
      } else {
        it.box = 0;
        it.due = Date.now() + 86400000; // reintento mañana
        quiz.again.push(q); // y una vez más en esta sesión
      }
      save();
    }
  }
  setTimeout(()=>{
    answered = false;
    quiz.i++;
    if(quiz.i < quiz.questions.length){
      renderQuestion();
    } else if(quiz.mode==="review" && quiz.again.length){
      quiz.questions = quiz.questions.concat(shuffle(quiz.again));
      quiz.again = [];
      renderQuestion();
    } else {
      finishQuiz();
    }
  }, ok ? 700 : 1600);
}

function finishQuiz(){
  const total = quiz.questions.length;
  const pct = Math.round(quiz.correct/total*100);
  let html = topnav(quiz.mode==="review" ? "Repaso" : cur.lesson.title);

  if(quiz.mode === "review"){
    html += '<div class="card center"><div class="bigmsg">🌟</div>'+
      '<h2>¡Repaso completado!</h2>'+
      '<p>'+quiz.correct+' de '+total+' correctas · +'+(quiz.correct*XP_REVIEW)+' XP</p>'+
      streakLine()+
      '<button class="btn big" onclick="renderHome()">Continuar</button></div>';
  } else {
    const passed = pct >= 80;
    if(passed){
      const first = !state.completed[cur.lesson.id];
      state.completed[cur.lesson.id] = true;
      addSrsItems(cur.lesson);
      addXp(XP_LESSON);
      html += '<div class="card center"><div class="bigmsg">🎉</div>'+
        '<h2>¡Lección aprobada!</h2>'+
        '<p>'+quiz.correct+' de '+total+' correctas ('+pct+'%) · +'+XP_LESSON+' XP</p>'+
        (first?'<p class="muted">Estos símbolos entraron a tu sistema de repasos: te los volveré a preguntar en los próximos días para que no se te olviden.</p>':'')+
        streakLine()+
        '<button class="btn big" onclick="renderHome()">Continuar</button></div>';
    } else {
      html += '<div class="card center"><div class="bigmsg">💪</div>'+
        '<h2>Casi…</h2>'+
        '<p>'+quiz.correct+' de '+total+' correctas ('+pct+'%). Necesitas 80% para aprobar.</p>'+
        '<p class="muted">Repasa los símbolos con calma y vuelve a intentarlo. ¡Así se aprende!</p>'+
        '<button class="btn big" onclick="startLesson(\''+cur.lesson.id+'\')">Repetir lección</button>'+
        '<p><button class="btn sec" onclick="renderHome()">Volver al inicio</button></p></div>';
    }
  }
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function streakLine(){
  const t = todayStr();
  if(state.lastStreakDay === t){
    return '<p style="font-size:20px">🔥 Racha: <b>'+state.streak+' día'+(state.streak===1?"":"s")+'</b> — ¡meta de hoy cumplida!</p>';
  }
  const falta = XP_GOAL - xpToday();
  return '<p class="muted">Te faltan '+falta+' XP para asegurar tu racha de hoy.</p>';
}

    '<p>Repasa cualquier símbolo aprendido cuando quieras, con guía o <b>de memoria</b>: solo con el romaji como pista, dibuja donde y del tamaño que quieras — la app escala tu dibujo y lo compara con la forma real. Cada acierto de memoria da <b>+'+XP_REVIEW+' XP</b>, así que también cuenta para tu racha.</p>'+
    '<p class="muted">La revisión es generosa a propósito: busca el mejor encaje aunque empieces corrido de lugar, y tolera unos milímetros de error para que un lápiz de punta redonda no te perjudique. Normalmente te <i>informa</i> pero te deja avanzar; si activas <b>modo estricto</b>, tendrás que trazarlo bien para continuar.</p>'+
    '<p class="muted">Ojo: algunas tipografías dibujan き y さ con la parte de abajo pegada, pero a mano se escriben con 4 y 3 trazos.</p>'+
    '</div>';
  html += '<div class="card">'+
    '<b>💾 Respaldar / pasar tu progreso a otro dispositivo</b>'+
    '<p class="muted">Tu progreso se guarda en este navegador. Para llevarlo a otra compu o al teléfono: copia el código de abajo y pégalo en el otro dispositivo con «Importar».</p>'+
    '<textarea class="io" id="ioBox" placeholder="Aquí aparece tu código de progreso, o pega uno para importar"></textarea>'+
    '<div style="display:flex; gap:10px; margin-top:8px">'+
    '<button class="btn sec" style="flex:1" onclick="exportProgress()">Exportar</button>'+
    '<button class="btn sec" style="flex:1" onclick="importProgress()">Importar</button>'+
    '</div><div class="feedback" id="ioMsg"></div></div>';
  html += '<p class="center muted">Total acumulado: ⭐ '+state.totalXp+' XP · '+Object.keys(state.completed).length+' de '+LESSONS.length+' lecciones</p>';
  app.innerHTML = html;
  window.scrollTo(0,0);
}
function exportProgress(){
  document.getElementById("ioBox").value = JSON.stringify(state);
  const m = document.getElementById("ioMsg");
  m.textContent = "✅ Listo: copia todo el texto del cuadro.";
  m.className = "feedback ok";
}
function importProgress(){
  const m = document.getElementById("ioMsg");
  try{
    const v = JSON.parse(document.getElementById("ioBox").value);
    if(typeof v !== "object" || !("completed" in v)) throw 0;
    state = Object.assign(state, v);
    save();
    m.textContent = "✅ Progreso importado correctamente.";
    m.className = "feedback ok";
    setTimeout(renderHome, 900);
  }catch(e){
    m.textContent = "❌ Ese código no es válido. Pega exactamente lo que exportaste.";
    m.className = "feedback no";
  }
}

/* ================= INICIO ================= */
load();
renderHome();

// Permite usar la app sin internet una vez que la abriste la primera vez.
// Solo aplica cuando está publicada (http/https), no al abrirla con doble clic.
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
